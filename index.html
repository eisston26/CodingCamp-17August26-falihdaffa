<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense & Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Chart.js Library dari CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Expense Tracker</h1>
            <button id="theme-toggle">🌙 Toggle Dark Mode</button>
        </header>

        <section class="balance-section">
            <h2>Total Balance</h2>
            <h3 id="total-balance">Rp 0</h3>
        </section>

        <section class="chart-section">
            <canvas id="expense-chart"></canvas>
        </section>

        <section class="form-section">
            <h3>Add New Transaction</h3>
            <form id="expense-form">
                <input type="text" id="item-name" placeholder="Item Name (e.g. Lunch)" required>
                <input type="number" id="item-amount" placeholder="Amount (Rp)" required>
                
                <select id="item-category" required>
                    <option value="" disabled selected>Select Category</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Fun">Fun</option>
                </select>
                <!-- Optional Challenge: Custom Category -->
                <input type="text" id="custom-category" placeholder="Custom Category (Opsional)">
                
                <button type="submit">Add Transaction</button>
            </form>
        </section>

        <section class="list-section">
            <div class="list-header">
                <h3>Transactions List</h3>
                <!-- Optional Challenge: Sort Transactions -->
                <select id="sort-transactions">
                    <option value="date-desc">Newest First</option>
                    <option value="amount-desc">Highest Amount</option>
                    <option value="amount-asc">Lowest Amount</option>
                    <option value="category">By Category</option>
                </select>
            </div>
            <ul id="transaction-list">
                <!-- Daftar item transaksi akan muncul di sini -->
            </ul>
        </section>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
